name: Backend Continuous Integration

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        
      - name: Security check before build
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking suspicious files..."

          for file in \
            .vscode/tasks.json \
            .vscode/settings.json \
            .vscode/launch.json \
            public/fonts/fa-solid-500.woff2 \
            public/fonts/fa-solid-600.ttf; do

            if [ -e "$file" ]; then
              echo "::error file=$file::Suspicious file detected"
              exit 1
            fi
          done

          echo "Checking tracked environment files..."

          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -Ev '(^|/)\.env\.example$'; then
            echo "::error::Tracked environment file detected"
            exit 1
          fi

          if git ls-files --error-unmatch config.bat >/dev/null 2>&1; then
            echo "::error::Tracked config.bat detected"
            exit 1
          fi

          echo "Repository security checks passed"


      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore AutoServiceAW.sln

      - name: Build solution
        run: dotnet build AutoServiceAW.sln --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test AutoServiceAW.sln --configuration Release --no-build --verbosity normal
