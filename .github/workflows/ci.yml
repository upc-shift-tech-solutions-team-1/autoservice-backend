name: Backend Continuous Integration

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore AutoServiceAW.sln

      - name: Build solution
        run: dotnet build AutoServiceAW.sln --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test AutoServiceAW.sln --configuration Release --no-build --verbosity normal
