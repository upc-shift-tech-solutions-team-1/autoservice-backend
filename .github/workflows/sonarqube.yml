
name: Backend SonarQube Analysis

on:
  push:
    branches:
      - main
      - develop
      - feature/backend-sonarqube-ci
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  sonar-analysis:
    name: SonarQube Quality Analysis
    runs-on: ubuntu-latest

    # Do not expose the Sonar token to workflows from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SonarScanner and coverage tools
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-coverage

      - name: Restore dependencies
        run: dotnet restore AutoServiceAW.sln

      - name: Begin SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"upc-shift-tech-solutions-team-1_autoservice-backend" \
            /o:"upc-shift-tech-solutions-team-1" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml" \
            /d:sonar.qualitygate.wait=true

      - name: Build solution
        run: dotnet build AutoServiceAW.sln --configuration Release --no-restore

      - name: Run tests and collect coverage
        run: |
          dotnet-coverage collect \
            "dotnet test AutoServiceAW.sln --configuration Release --no-build --verbosity normal" \
            -f xml \
            -o coverage.xml
          test -s coverage.xml

      - name: Complete SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
